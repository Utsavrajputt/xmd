name: Preview Build

# Manual preview build. Builds signed preview APKs and publishes them on the
# GitHub Pages site under /previews/r<run number>/ -- NOT as a GitHub Release.
# The last 3 previews stay online (older ones are dropped, see
# scripts/stage_pages.py). The app's Preview update channel detects new builds
# from this workflow's successful runs and downloads the APKs from Pages.
#
# Scheduled/automatic builds are switched off for now. To turn them back on add
# a `schedule:` (or `push:`) trigger below.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Same group as deploy-site.yml: both replace the single Pages deployment, so
# they must never run at the same time (and never cancel each other).
concurrency:
  group: xmd-pages
  cancel-in-progress: false

env:
  # flavor-abi labels, matching selectXmdApkAsset() in the app.
  FLAVORS: lite full
  ABIS: arm64-v8a armeabi-v7a
  KEEP_PREVIEWS: 3

jobs:
  build-preview:
    name: Build and publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # build.gradle.kts reads GITHUB_RUN_NUMBER into BuildConfig.PREVIEW_RUN;
      # the app compares it with the newest successful run of this workflow.
      - name: Build preview APKs
        env:
          XMD_GITHUB_CLIENT_ID: ${{ secrets.XMD_GITHUB_CLIENT_ID }}
        run: ./gradlew assemblePreview --stacktrace --no-daemon --max-workers=2

      - name: Sign and verify preview APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing; refusing to publish unsigned preview APKs."
            exit 1
          fi
          test -x "$apksigner"

          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          mkdir -p preview-assets
          for flavor in $FLAVORS; do
            for abi in $ABIS; do
              unsigned=$(compgen -G "app/build/outputs/apk/${flavor}/preview/*${abi}*-unsigned.apk" | head -n1 || true)
              if [[ -z "$unsigned" ]]; then
                echo "::error::Missing expected APK for ${flavor}/${abi}"
                find app/build/outputs/apk -type f -name '*.apk' -print || true
                exit 1
              fi
              signed="preview-assets/Xmd-${flavor}-${abi}-preview-r${RUN_NUMBER}.apk"
              # v4 signing off: no .idsig side files, only the APK is published.
              "$apksigner" sign \
                --ks release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --v4-signing-enabled false \
                --out "$signed" \
                "$unsigned"
              "$apksigner" verify --verbose "$signed"
            done
          done
          rm -f preview-assets/*.idsig
          ls -l preview-assets

      - name: Stage site with this preview and the previous ones
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          python3 scripts/stage_pages.py \
            --out site \
            --repo "$GITHUB_REPOSITORY" \
            --site-url "https://${owner}.github.io/${repo_name}" \
            --keep "$KEEP_PREVIEWS" \
            --new-run "$RUN_NUMBER" \
            --new-apks preview-assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
