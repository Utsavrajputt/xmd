name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'fastlane/metadata/android/preview-site/**'
  workflow_dispatch:

concurrency:
  group: xmd-preview-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-site:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp fastlane/metadata/android/preview-site/index.html site/index.html
          cp fastlane/metadata/android/preview-site/icon.png site/icon.png
          cp fastlane/metadata/android/preview-site/site.webmanifest site/site.webmanifest
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
